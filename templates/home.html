<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pastebin by Onre</title>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #171a21;
            --border: #2a2e38;
            --text: #e4e6eb;
            --muted: #8a8f98;
            --accent: #5b8cff;
            --accent-hover: #7ba1ff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .page {
            width: 100%;
            max-width: 480px;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 32px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }

        .panel h3 {
            margin-top: 0;
            font-size: 1.05rem;
            color: var(--muted);
            font-weight: 600;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
            margin: 14px 0 6px;
        }

        input[type="text"], textarea, select {
            width: 100%;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            font-family: inherit;
            font-size: 0.95rem;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
            font-family: "Consolas", monospace;
        }

        button {
            margin-top: 18px;
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .form-error {
            display: none;
            margin: 14px 0 0;
            padding: 8px 10px;
            border: 1px solid #a33;
            border-radius: 6px;
            background: rgba(170, 51, 51, 0.15);
            color: #ff9b9b;
            font-size: 0.85rem;
        }

        .form-error.visible {
            display: block;
        }

        input.invalid, textarea.invalid, input[type="file"].invalid {
            border-color: #a33;
        }

        .drop-zone {
            margin-top: 6px;
            padding: 36px 16px;
            border: 2px dashed var(--border);
            border-radius: 8px;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s, color 0.15s;
        }

        .drop-zone:hover {
            border-color: var(--accent-hover);
            color: var(--text);
        }

        .drop-zone.drag-active {
            border-color: var(--accent);
            background: rgba(91, 140, 255, 0.1);
            color: var(--text);
        }

        .drop-zone.invalid {
            border-color: #a33;
        }

        .drop-zone .drop-zone-filename {
            color: var(--text);
            font-weight: 600;
            word-break: break-all;
        }

        .form-hint {
            margin: 6px 0 0;
            font-size: 0.78rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>Pastebin by Onre</h1>

        <div class="panel">
            <h3>Submit a Paste</h3>
            <form id="paste-form"
                data-max-paste-size="{{MAX_PASTE_SIZE_BYTES}}" data-max-paste-size-label="{{MAX_PASTE_SIZE}}"
                data-max-file-size="{{MAX_FILE_SIZE_BYTES}}" data-max-file-size-label="{{MAX_FILE_SIZE}}">
                <label for="content" id="content-label">Content</label>
                <textarea id="content" placeholder="Content" required></textarea>

                <div class="drop-zone" id="drop-zone" hidden>
                    <input type="file" id="file-input" hidden>
                    <p id="drop-zone-text">Drag &amp; drop a file anywhere on this page, or click here to browse</p>
                </div>
                <p class="form-hint" id="file-hint" hidden>The file is sent unchanged (binary) — images, ZIP, and other binary formats are supported. Maximum file size: {{MAX_FILE_SIZE}}.</p>

                <label for="mimetype">MIME Type</label>
                <select id="mimetype">
                    <option value="PlainText">Plain Text</option>
                    <option value="Html">HTML</option>
                    <option value="Markdown">Markdown</option>
                    <option value="OctetStream">Octet Stream</option>
                </select>

                <p id="form-error" class="form-error"></p>

                <button id="submit">Submit</button>
            </form>
        </div>
    </div>

    <script>
        const contentInput = document.getElementById('content');
        const contentLabel = document.getElementById('content-label');
        const dropZone = document.getElementById('drop-zone');
        const dropZoneText = document.getElementById('drop-zone-text');
        const fileInput = document.getElementById('file-input');
        const fileHint = document.getElementById('file-hint');
        const mimetypeSelect = document.getElementById('mimetype');
        const formError = document.getElementById('form-error');

        const pasteForm = document.getElementById('paste-form');
        const maxPasteSize = Number(pasteForm.dataset.maxPasteSize);
        const maxPasteSizeLabel = pasteForm.dataset.maxPasteSizeLabel;
        const maxFileSize = Number(pasteForm.dataset.maxFileSize);
        const maxFileSizeLabel = pasteForm.dataset.maxFileSizeLabel;

        function isOctetStream() {
            return mimetypeSelect.value === 'OctetStream';
        }

        function syncInputForMimetype() {
            const octetStream = isOctetStream();

            contentLabel.hidden = octetStream;
            contentInput.hidden = octetStream;
            contentInput.required = !octetStream;

            dropZone.hidden = !octetStream;
            fileHint.hidden = !octetStream;

            formError.classList.remove('visible');
            contentInput.classList.remove('invalid');
            dropZone.classList.remove('invalid');
        }

        mimetypeSelect.addEventListener('change', syncInputForMimetype);
        syncInputForMimetype();

        function showFormError(message) {
            formError.textContent = message;
            formError.classList.add('visible');
        }

        function clearFormError() {
            formError.textContent = '';
            formError.classList.remove('visible');
        }

        // btoa() only accepts Latin1 - encode to UTF-8 bytes first so file
        // names with non-ASCII characters (e.g. "obrázek.png") survive.
        function fileNameToBase64(name) {
            const utf8Bytes = new TextEncoder().encode(name);
            let binary = '';
            utf8Bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
            return btoa(binary);
        }

        function updateDropZoneLabel() {
            if (fileInput.files.length > 0) {
                dropZoneText.innerHTML = `Selected: <span class="drop-zone-filename"></span>`;
                dropZoneText.querySelector('.drop-zone-filename').textContent = fileInput.files[0].name;
            } else {
                dropZoneText.textContent = 'Drag & drop a file anywhere on this page, or click here to browse';
            }
        }

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            updateDropZoneLabel();
            dropZone.classList.remove('invalid');
            clearFormError();
        });

        let dragCounter = 0;

        document.body.addEventListener('dragenter', (event) => {
            event.preventDefault();
            if (!isOctetStream()) return;
            dragCounter++;
            dropZone.classList.add('drag-active');
        });

        document.body.addEventListener('dragover', (event) => {
            event.preventDefault();
        });

        document.body.addEventListener('dragleave', (event) => {
            event.preventDefault();
            if (!isOctetStream()) return;
            dragCounter = Math.max(0, dragCounter - 1);
            if (dragCounter === 0) {
                dropZone.classList.remove('drag-active');
            }
        });

        document.body.addEventListener('drop', (event) => {
            event.preventDefault();
            dragCounter = 0;
            dropZone.classList.remove('drag-active');

            if (!isOctetStream() || !event.dataTransfer.files.length) {
                return;
            }

            fileInput.files = event.dataTransfer.files;
            updateDropZoneLabel();
            dropZone.classList.remove('invalid');
            clearFormError();
        });

        function validateForm() {
            contentInput.classList.remove('invalid');
            dropZone.classList.remove('invalid');

            if (isOctetStream()) {
                if (fileInput.files.length === 0) {
                    dropZone.classList.add('invalid');
                    showFormError('Please select a file.');
                    return false;
                }
                if (fileInput.files[0].size === 0) {
                    dropZone.classList.add('invalid');
                    showFormError('The selected file is empty.');
                    return false;
                }
                if (fileInput.files[0].size > maxFileSize) {
                    dropZone.classList.add('invalid');
                    showFormError(`The file is too large. Maximum file size is ${maxFileSizeLabel}.`);
                    return false;
                }
            } else if (contentInput.value.trim() === '') {
                contentInput.classList.add('invalid');
                showFormError('Content must not be empty.');
                return false;
            } else if (new TextEncoder().encode(contentInput.value).length > maxPasteSize) {
                contentInput.classList.add('invalid');
                showFormError(`The content is too large. Maximum size is ${maxPasteSizeLabel}.`);
                return false;
            }

            clearFormError();
            return true;
        }

        // Server errors are plain text (AppError / axum rejections). A reverse proxy
        // may answer with its own HTML error page instead, so only plain text is shown.
        async function readServerMessage(response) {
            const contentType = response.headers.get('Content-Type') || '';
            if (!contentType.startsWith('text/plain')) {
                return '';
            }
            try {
                const text = (await response.text()).trim();
                return text.length > 300 ? text.slice(0, 300) + '…' : text;
            } catch {
                return '';
            }
        }

        // statusText is always empty over HTTP/2, so the message is built from the status code.
        function describeError(status, serverMessage, isFile) {
            const detail = serverMessage ? ` (${serverMessage})` : '';
            switch (status) {
                case 413:
                    return isFile
                        ? `The file is too large. Maximum file size is ${maxFileSizeLabel}.`
                        : `The content is too large. Maximum size is ${maxPasteSizeLabel}.`;
                case 400:
                    return serverMessage
                        ? `The paste was rejected: ${serverMessage}`
                        : 'The paste was rejected by the server.';
                case 422:
                    return `The server could not process the request${detail}.`;
                default:
                    return status >= 500
                        ? `Server error (HTTP ${status}). Please try again later.`
                        : `The request failed (HTTP ${status})${detail}.`;
            }
        }

        document.getElementById('submit').addEventListener('click', async (event) => {
            event.preventDefault();
            const mimetypeValue = mimetypeSelect.value;
            const isFile = isOctetStream();

            if (!validateForm()) {
                return;
            }

            let response;
            try {
                response = isFile
                    ? await fetch('/paste/binary', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/octet-stream',
                            'X-File-Name-B64': fileNameToBase64(fileInput.files[0].name),
                        },
                        body: fileInput.files[0],
                    })
                    : await fetch('/paste/json', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ "content": contentInput.value, "mimetype": mimetypeValue }),
                    });
            } catch (error) {
                showFormError('Could not reach the server. Check your connection and try again.');
                console.error('Network error:', error);
                return;
            }

            if (response.ok) {
                const id = await response.json();
                window.location.href = '/paste/' + id;
            } else {
                const serverMessage = await readServerMessage(response);
                showFormError(describeError(response.status, serverMessage, isFile));
                console.error(`HTTP ${response.status}`, serverMessage);
            }
        });
    </script>
</body>
</html>
