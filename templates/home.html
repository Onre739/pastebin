<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pastebin by Onre</title>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #171a21;
            --border: #2a2e38;
            --text: #e4e6eb;
            --muted: #8a8f98;
            --accent: #5b8cff;
            --accent-hover: #7ba1ff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .page {
            width: 100%;
            max-width: 480px;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 32px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }

        .panel h3 {
            margin-top: 0;
            font-size: 1.05rem;
            color: var(--muted);
            font-weight: 600;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
            margin: 14px 0 6px;
        }

        input[type="text"], textarea, select {
            width: 100%;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            font-family: inherit;
            font-size: 0.95rem;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
            font-family: "Consolas", monospace;
        }

        button {
            margin-top: 18px;
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .form-error {
            display: none;
            margin: 14px 0 0;
            padding: 8px 10px;
            border: 1px solid #a33;
            border-radius: 6px;
            background: rgba(170, 51, 51, 0.15);
            color: #ff9b9b;
            font-size: 0.85rem;
        }

        .form-error.visible {
            display: block;
        }

        input.invalid, textarea.invalid, input[type="file"].invalid {
            border-color: #a33;
        }

        input[type="file"] {
            width: 100%;
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 10px;
            font-family: inherit;
            font-size: 0.9rem;
        }

        .form-hint {
            margin: 6px 0 0;
            font-size: 0.78rem;
            color: var(--muted);
        }

        .success-panel {
            display: none;
            margin-top: 20px;
        }

        .success-panel.visible {
            display: block;
        }

        .success-panel h3 {
            color: var(--text);
        }

        .success-panel code {
            display: block;
            margin: 6px 0 14px;
            padding: 8px 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: "Consolas", monospace;
            font-size: 0.9rem;
            word-break: break-all;
        }

        .success-panel a {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>Pastebin by Onre</h1>

        <div class="panel">
            <h3>Submit a Paste</h3>
            <form id="paste-form">
                <label for="content" id="content-label">Content</label>
                <textarea id="content" placeholder="Content" required></textarea>

                <input type="file" id="file-input" hidden>
                <p class="form-hint" id="file-hint" hidden>The file is sent unchanged (binary) — images, ZIP, and other binary formats are supported. Maximum file size: {{MAX_FILE_SIZE_MB}} MB.</p>

                <label for="mimetype">MIME Type</label>
                <select id="mimetype">
                    <option value="PlainText">Plain Text</option>
                    <option value="Html">HTML</option>
                    <option value="Markdown">Markdown</option>
                    <option value="OctetStream">Octet Stream</option>
                </select>

                <p id="form-error" class="form-error"></p>

                <button id="submit">Submit</button>
            </form>
        </div>

        <div class="panel success-panel" id="success-panel">
            <h3>File paste created</h3>
            <p>Opening the paste's URL downloads the file directly, so here's its ID:</p>
            <code id="success-id"></code>
            <a id="success-link" href="#">Download the file</a>
        </div>
    </div>

    <script>
        const contentInput = document.getElementById('content');
        const contentLabel = document.getElementById('content-label');
        const fileInput = document.getElementById('file-input');
        const fileHint = document.getElementById('file-hint');
        const mimetypeSelect = document.getElementById('mimetype');
        const formError = document.getElementById('form-error');
        const successPanel = document.getElementById('success-panel');
        const successId = document.getElementById('success-id');
        const successLink = document.getElementById('success-link');

        function isOctetStream() {
            return mimetypeSelect.value === 'OctetStream';
        }

        function syncInputForMimetype() {
            const octetStream = isOctetStream();

            contentLabel.hidden = octetStream;
            contentInput.hidden = octetStream;
            contentInput.required = !octetStream;

            fileInput.hidden = !octetStream;
            fileHint.hidden = !octetStream;

            formError.classList.remove('visible');
            contentInput.classList.remove('invalid');
            fileInput.classList.remove('invalid');
            successPanel.classList.remove('visible');
        }

        mimetypeSelect.addEventListener('change', syncInputForMimetype);
        syncInputForMimetype();

        function showFormError(message) {
            formError.textContent = message;
            formError.classList.add('visible');
        }

        function clearFormError() {
            formError.textContent = '';
            formError.classList.remove('visible');
        }

        // btoa() only accepts Latin1 - encode to UTF-8 bytes first so file
        // names with non-ASCII characters (e.g. "obrázek.png") survive.
        function fileNameToBase64(name) {
            const utf8Bytes = new TextEncoder().encode(name);
            let binary = '';
            utf8Bytes.forEach((byte) => { binary += String.fromCharCode(byte); });
            return btoa(binary);
        }

        function validateForm() {
            contentInput.classList.remove('invalid');
            fileInput.classList.remove('invalid');

            if (isOctetStream()) {
                if (fileInput.files.length === 0) {
                    fileInput.classList.add('invalid');
                    showFormError('Vyber soubor.');
                    return false;
                }
            } else if (contentInput.value.trim() === '') {
                contentInput.classList.add('invalid');
                showFormError('Content must not be empty.');
                return false;
            }

            clearFormError();
            return true;
        }

        document.getElementById('submit').addEventListener('click', async (event) => {
            event.preventDefault();
            const mimetypeValue = mimetypeSelect.value;

            if (!validateForm()) {
                return;
            }

            const response = isOctetStream()
                ? await fetch('/paste/binary', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/octet-stream',
                        'X-File-Name-B64': fileNameToBase64(fileInput.files[0].name),
                    },
                    body: fileInput.files[0],
                })
                : await fetch('/paste/json', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ "content": contentInput.value, "mimetype": mimetypeValue }),
                });

            if (response.ok) {
                const id = await response.json();

                if (isOctetStream()) {
                    successId.textContent = id;
                    successLink.href = '/paste/' + id;
                    successPanel.classList.add('visible');
                } else {
                    window.location.href = '/paste/' + id;
                }
            } else {
                showFormError(`HTTP Chyba: ${response.status} - ${response.statusText}`);
                console.error(`HTTP Chyba: ${response.status} - ${response.statusText}`);
            }
        });
    </script>
</body>
</html>
