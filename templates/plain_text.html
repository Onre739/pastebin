<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pastebin by Onre</title>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #171a21;
            --border: #2a2e38;
            --text: #e4e6eb;
            --muted: #8a8f98;
            --accent: #5b8cff;
            --accent-hover: #7ba1ff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .page {
            width: 100%;
            max-width: 800px;
        }

        h1.site-title {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 32px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px 28px;
        }

        .plain-text-body {
            margin: 0;
            font-family: "Consolas", monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="page">
        <h1 class="site-title">Pastebin by Onre</h1>
        <div class="panel">
            <pre class="plain-text-body">{{CONTENT}}</pre>
        </div>
    </div>
</body>
</html>
