name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  docker:
    name: Build & push Docker image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # --- GITOPS AUTOMATIZACE ---
      - name: Update image tag in GitOps repository
        env:
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          # 1. Spočítáme 7znakový SHA tag (přesně odpovídá tomu, co generuje docker/metadata-action)
          NEW_TAG="sha-${GITHUB_SHA::7}"

          # 2. Nastavení Git identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 3. Klonování GitOps repozitáře
          git clone https://x-access-token:${GITOPS_PAT}@github.com/Onre739/pastebin-gitops.git gitops-repo
          cd gitops-repo

          # 4. Nahrazení starého tagu novým v souboru k8s/app.yaml
          # Najde jakýkoliv ghcr.io/onre739/pastebin:sha-xxxxxxx a nahradí ho novým SHA
          sed -i -E "s|ghcr.io/onre739/pastebin:sha-[a-f0-9]+|ghcr.io/onre739/pastebin:${NEW_TAG}|g" k8s/app.yaml

          # 5. Commit a push změn pouze pokud došlo ke změně
          if ! git diff --quiet; then
            git commit -am "ci: update pastebin image to ${NEW_TAG}"
            git push
          else
            echo "Žádná změna v tagu, přesakuji commit."
          fi
